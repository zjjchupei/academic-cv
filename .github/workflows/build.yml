# Auto-compile CV from content_inventory.yaml via build_cv.py
# On push: generate cv.tex from atoms → compile PDF → deploy to GitHub Pages

name: build
on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Generate cv.tex from atoms
        run: python build_cv.py --full --no-compile

      - name: Compile CV with LaTeX
        uses: dante-ev/latex-action@latest
        with:
          root_file: cv
          working_directory: .

      - name: Prepare artifacts
        run: mkdir -p github_artifacts && mv cv.pdf ./github_artifacts/

      - name: Upload pdf as artifact
        uses: actions/upload-artifact@v4
        with:
          name: cv.pdf
          path: ./github_artifacts

  deploy:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: github_artifacts
      - name: move
        run: mkdir -p github_deploy && mv github_artifacts/*/* github_deploy
      - name: deploy on orphan branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./github_deploy
          publish_branch: build
          force_orphan: true
          enable_jekyll: true

  copy-index-to-build:
    needs: [deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Copy To Branches Action
        uses: planetoftheweb/copy-to-branches@v1.3
        env:
          key: main
          files: index.html CNAME
