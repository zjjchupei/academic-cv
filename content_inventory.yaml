# =============================================================================
# Content Inventory — Every CV bullet with LaTeX-ready text
# =============================================================================
# Each atom:
#   latex:    Actual LaTeX code to render
#   lines:   Estimated rendered lines at 10pt scale=0.92
#   proves:  Criteria tags this atom provides evidence for
#   section: CV section it belongs to
#   priority: Base priority (0-10)
#   fixed:   Always included regardless of score
#   variant_of: For mutually exclusive variants (e.g., profile)
# =============================================================================

# ─────────────────────────────────────────────────────────────────────────────
# HEADER (always, 3 lines)
# ─────────────────────────────────────────────────────────────────────────────
