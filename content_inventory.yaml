  fixed: true

# ─────────────────────────────────────────────────────────────────────────────
# PROFILE VARIANTS (choose one, ~4 lines)
# ─────────────────────────────────────────────────────────────────────────────
profile_research:
  section: profile
  variant_of: profile
  latex: |
    \section{Profile}
    PhD researcher in corporate governance and technology management, with expertise in machine learning, survival analysis, and panel data econometrics. Doctoral research investigates the timing and dynamics of Chief Technology Officer appointments, contributing to upper echelons theory and strategic leadership literature. Published in the \textit{International Journal of Finance \& Economics} with four additional working papers targeting top-tier journals. Eight years of professional experience in financial policy analysis at the People's Bank of China. Seeking a research-focused academic position in business and management.
  lines: 6
  proves: [phd, research_focus, quantitative_methods, industry_experience, research_vision, publication_record]
  priority: 10

profile_teaching:
  section: profile
  variant_of: profile
  latex: |
    \section{Profile}
    PhD researcher with a strong commitment to excellence in teaching, holding a Postgraduate Certificate in Academic Practice from the University of Edinburgh. Three years of university teaching experience delivering 120+ tutorial sessions to 400+ students in corporate finance, supervising 20+ MSc dissertations with 5 awarded Distinction. Research expertise in corporate governance and quantitative methods (machine learning, survival analysis, panel econometrics). Published in the \textit{International Journal of Finance \& Economics} . Eight years of professional experience at the People's Bank of China, bringing real-world insights to the classroom.
  lines: 6
  proves: [phd, teaching_focus, teaching_qualification, quantified_teaching, industry_experience, publication_record]
  priority: 10

profile_balanced:
  section: profile
  variant_of: profile
  latex: |
    \section{Profile}
    PhD researcher in corporate governance and technology management, with expertise in machine learning, survival analysis, and panel data econometrics. Doctoral research investigates the timing and dynamics of Chief Technology Officer appointments, contributing to upper echelons theory and strategic leadership literature. Three years of university teaching experience with 400+ students taught and 20+ MSc dissertations supervised. Published in the \textit{International Journal of Finance \& Economics} . Eight years of professional experience in financial policy analysis at the People's Bank of China.
  lines: 6
  proves: [phd, research_focus, teaching_focus, quantitative_methods, industry_experience, publication_record]
  priority: 10

