    \href{mailto:zjjxitongchu@gmail.com}{\raisebox{-0.05\height}\faEnvelope\ zjjxitongchu@gmail.com} \ $|$ \
    \href{tel:+447421726955}{\raisebox{-0.05\height}\faMobile\ +44\,7421\,726955} \ $|$ \
    \raisebox{-0.05\height}\faMapMarker*\ Edinburgh, UK \\
    \end{tabularx}
  lines: 3
